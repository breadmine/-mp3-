<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>本地 MP3 播放器</title>
<style>
  /* ========== 配色：暗色冷调，无网络、纯本地 ========== */
  :root{
    --bg:#0e1013;        /* 页面底色 */
    --panel:#171a21;     /* 面板 */
    --line:#262b36;      /* 分隔线 */
    --txt:#e6e9ef;       /* 主文字 */
    --dim:#8b93a3;       /* 次要文字 */
    --acc:#3dd68c;       /* 强调色（播放中高亮） */
    --hover:#20242e;     /* 悬停背景 */
    --danger:#d65b5b;    /* 删除按钮 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  .app{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ========== 顶部标题 ========== */
  header h1{font-size:20px;font-weight:600;letter-spacing:1px;}
  header p{color:var(--dim);font-size:12px;margin-top:4px;}

  /* ========== 选择/拖拽区 ========== */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:22px 14px;
    text-align:center;
    color:var(--dim);
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    user-select:none;
  }
  .drop:hover,.drop.drag{ border-color:var(--acc); color:var(--txt); background:var(--hover); }
  .drop input{display:none;}
  .drop .big{display:block;font-size:15px;margin-bottom:4px;color:var(--txt);}

  /* ========== 播放器主体 ========== */
  .player{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .now{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-height:20px;
  }
  .now .none{color:var(--dim);font-weight:400;font-size:13px;}
  .bar{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .bar input[type=range]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:2px;
    background:var(--line);
    outline:none;
    cursor:pointer;
  }
  .bar input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--acc);
    border:none;
    cursor:pointer;
  }
  .bar .time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* 控制按钮排 */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .controls button{
    background:none;
    border:none;
    color:var(--txt);
    font-size:14px;
    cursor:pointer;
    padding:6px 10px;
    border-radius:8px;
    transition:background .12s;
  }
  .controls button:hover{background:var(--hover);}
  .controls button:disabled{color:#4a5160;cursor:not-allowed;}
  .controls .play{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--acc);
    color:#0b0d10;
    font-size:18px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .controls .play:hover{background:#52e8a0;}

  /* 音量 / 倍速 / 循环 */
  .extras{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:12px;
    color:var(--dim);
  }
  .extras label{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .extras input[type=range]{width:90px;}
  .extras select{
    background:var(--hover);
    color:var(--txt);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 6px;
    font-size:12px;
    outline:none;
  }
  .loop-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--dim);
    border-radius:6px;
    padding:3px 8px;
    font-size:12px;
    cursor:pointer;
  }
  .loop-btn.active{color:var(--acc);border-color:var(--acc);}

  /* ========== 播放列表 ========== */
  .list-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:380px;
    overflow-y:auto;
  }
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--dim);
    padding:0 6px 6px;
    border-bottom:1px solid var(--line);
  }
  .list-head button{
    background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:4px;
  }
  .list-head button:hover{color:var(--danger);}
  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:background .12s;
  }
  .item:hover{background:var(--hover);}
  .item.playing{background:var(--hover);}
  .item.playing .name{color:var(--acc);}
  .item .idx{color:var(--dim);font-size:12px;width:24px;text-align:center;flex-shrink:0;}
  .item .name{
    flex:1;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item .len{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0;}
  .item .del{
    background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;
    width:26px;height:26px;border-radius:6px;flex-shrink:0;line-height:1;
  }
  .item .del:hover{color:var(--danger);background:rgba(214,91,91,.12);}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0;}

  /* ========== 滚动条 ========== */
  .list-wrap::-webkit-scrollbar{width:6px;}
  .list-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>本地 MP3 播放器</h1>
    <p>纯本地 · 不联网</p>
  </header>

  <!-- 选择文件区：点击或拖拽 -->
  <div class="drop" id="drop">
    <span class="big">点击选择文件，或把音乐拖进来</span>
    <span>支持 mp3 / wav / ogg / m4a / flac（浏览器原生支持的格式）</span>
    <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac" />
  </div>

  <!-- 播放器主体 -->
  <div class="player">
    <div class="now" id="nowPlaying"><span class="none">还没有选择歌曲</span></div>

    <!-- 进度条 -->
    <div class="bar">
      <span class="time" id="curTime">00:00</span>
      <input type="range" id="seek" min="0" max="0" value="0" step="0.01" />
      <span class="time" id="totalTime">00:00</span>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button id="prevBtn" title="上一首">⏮</button>
      <button class="play" id="playBtn" title="播放/暂停">▶</button>
      <button id="nextBtn" title="下一首">⏭</button>
    </div>

    <!-- 音量 / 倍速 / 循环 -->
    <div class="extras">
      <label>🔊 <input type="range" id="vol" min="0" max="100" value="80" /></label>
      <label>倍速
        <select id="rate">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </label>
      <button class="loop-btn" id="loopBtn" title="切换循环模式">循环:全部</button>
    </div>
  </div>

  <!-- 播放列表 -->
  <div class="list-wrap" id="list">
    <div class="list-head">
      <span id="listCount">播放列表 (0)</span>
      <button id="clearBtn">清空</button>
    </div>
    <div id="listBody"><div class="empty">把音乐拖进来，或点击上方选择文件</div></div>
  </div>

</div>

<script>
"use strict";
/* ============================================================
   本地 MP3 播放器 —— 全部逻辑都在这个文件里，零依赖、零网络请求
   核心思路：
   1. 用 URL.createObjectURL(文件) 把本地文件变成临时地址喂给 Audio
   2. 所有播放控制基于 HTML5 <audio> 的 API
   3. 播放列表就是一个数组，index 指向当前播放的曲目
   ============================================================ */

// ---------- 状态 ----------
const state = {
  list: [],      // 播放列表：每个元素 { name, url, duration }
  index: -1,     // 当前播放的列表下标，-1 表示没有在播
  loop: "all",   // 循环模式: all=列表循环 / one=单曲循环 / rand=随机
};

// ---------- DOM 引用 ----------
const audio = new Audio();                 // 唯一的音频对象
audio.preload = "metadata";
const $ = id => document.getElementById(id);
const dropEl = $("drop"), fileInput = $("fileInput");
const nowEl = $("nowPlaying"), seek = $("seek");
const curTimeEl = $("curTime"), totalTimeEl = $("totalTime");
const playBtn = $("playBtn"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");
const volEl = $("vol"), rateSel = $("rate"), loopBtn = $("loopBtn");
const listBody = $("listBody"), listCount = $("listCount");

// ---------- 工具函数 ----------
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return "00:00";
  sec = Math.floor(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function renderList() {
  // 用 createElement + textContent 渲染列表（不用 innerHTML 拼字符串，防注入）
  listBody.textContent = "";
  listCount.textContent = "播放列表 (" + state.list.length + ")";
  if (state.list.length === 0) {
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = "把音乐拖进来，或点击上方选择文件";
    listBody.appendChild(div);
    return;
  }
  state.list.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "item" + (i === state.index ? " playing" : "");
    row.dataset.index = i;

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(i + 1).padStart(2, "0");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    const len = document.createElement("span");
    len.className = "len";
    len.textContent = item.duration ? formatTime(item.duration) : "--:--";
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.title = "从列表移除";
    del.addEventListener("click", e => { e.stopPropagation(); removeAt(i); });

    row.appendChild(idx); row.appendChild(name); row.appendChild(len); row.appendChild(del);
    // 单击整行 = 播放这一首
    row.addEventListener("click", () => playAt(i));
    listBody.appendChild(row);
  });
}

function addFiles(fileList) {
  // 追加进列表，不覆盖旧内容
  for (const file of fileList) {
    if (!file.type.startsWith("audio/") && !/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(file.name)) continue;
    const url = URL.createObjectURL(file);
    state.list.push({ name: file.name, url, duration: 0 });
  }
  renderList();
  // 如果之前什么都没在播，自动播放第一首
  if (state.index === -1 && state.list.length > 0) playAt(0);
}

function removeAt(i) {
  const item = state.list[i];
  if (!item) return;
  if (i === state.index) {
    audio.pause();
    state.index = -1;
    updateNowPlaying();
  }
  URL.revokeObjectURL(item.url);
  state.list.splice(i, 1);
  if (i < state.index) state.index--; // 删掉了前面的歌，当前下标要前移
  renderList();
}

function updateNowPlaying() {
  const item = state.index >= 0 ? state.list[state.index] : null;
  nowEl.textContent = "";
  if (!item) {
    const span = document.createElement("span");
    span.className = "none";
    span.textContent = "还没有选择歌曲";
    nowEl.appendChild(span);
  } else {
    nowEl.textContent = item.name;
  }
  playBtn.textContent = item ? "⏸" : "▶"; // 有歌在播时按钮显示暂停图标
}

function playAt(i) {
  if (i < 0 || i >= state.list.length) return;
  state.index = i;
  const item = state.list[i];
  audio.src = item.url;
  audio.play().catch(() => {/* 用户还没交互时浏览器会拦截，属正常 */});
  updateNowPlaying();
  renderList();
}

function nextTrack() {
  if (state.list.length === 0) return;
  let next;
  if (state.loop === "rand") {
    next = Math.floor(Math.random() * state.list.length);
  } else {
    next = (state.index + 1) % state.list.length; // 到末尾就回开头
  }
  playAt(next);
}

// ---------- 播放按钮 ----------
playBtn.addEventListener("click", () => {
  if (state.index === -1) {
    if (state.list.length > 0) { playAt(0); }
    return;
  }
  if (audio.paused) audio.play();
  else audio.pause();
});
prevBtn.addEventListener("click", () => {
  if (state.list.length === 0) return;
  // 播放超过 3 秒就回到开头，否则切上一首
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const prev = (state.index - 1 + state.list.length) % state.list.length;
  playAt(prev);
});
nextBtn.addEventListener("click", nextTrack);

// ---------- 进度条 ----------
audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration || 0;
  totalTimeEl.textContent = formatTime(audio.duration);
  if (state.index >= 0) state.list[state.index].duration = audio.duration;
  renderList();
});
audio.addEventListener("timeupdate", () => {
  seek.value = audio.currentTime;
  curTimeEl.textContent = formatTime(audio.currentTime);
});
seek.addEventListener("input", () => { audio.currentTime = parseFloat(seek.value); });
// 播放结束时按循环模式处理
audio.addEventListener("ended", () => {
  if (state.loop === "one") { audio.currentTime = 0; audio.play(); return; }
  nextTrack();
});

// ---------- 音量 & 倍速 ----------
volEl.addEventListener("input", () => { audio.volume = parseInt(volEl.value, 10) / 100; });
rateSel.addEventListener("change", () => { audio.playbackRate = parseFloat(rateSel.value); });

// ---------- 循环模式 ----------
const loopLabels = { all: "循环:全部", one: "循环:单曲", rand: "循环:随机" };
loopBtn.addEventListener("click", () => {
  const order = ["all", "one", "rand"];
  state.loop = order[(order.indexOf(state.loop) + 1) % order.length];
  loopBtn.textContent = loopLabels[state.loop];
  loopBtn.classList.toggle("active", state.loop !== "all");
});

// ---------- 文件选择 & 拖拽 ----------
dropEl.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

["dragenter", "dragover"].forEach(ev => dropEl.addEventListener(ev, e => {
  e.preventDefault(); dropEl.classList.add("drag");
}));
["dragleave", "drop"].forEach(ev => dropEl.addEventListener(ev, e => {
  e.preventDefault(); dropEl.classList.remove("drag");
}));
dropEl.addEventListener("drop", e => {
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

// ---------- 清空列表 ----------
$("clearBtn").addEventListener("click", () => {
  audio.pause();
  audio.removeAttribute("src");
  state.list.forEach(item => URL.revokeObjectURL(item.url));
  state.list = [];
  state.index = -1;
  seek.max = 0; seek.value = 0;
  curTimeEl.textContent = "00:00"; totalTimeEl.textContent = "00:00";
  updateNowPlaying();
  renderList();
});

// 初始化
audio.volume = 0.8;
updateNowPlaying();
renderList();
</script>
</body>
</html>
